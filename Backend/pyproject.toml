[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "support-case-classifier-backend"
version = "1.0.0"
description = "FastAPI backend for configurable LLM support-case classification."
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "langchain-core>=0.3.63,<2",
  "langchain-google-genai>=2.1.5,<5",
  "langchain-ollama>=0.3.3,<2",
  "langchain-openai>=0.3.19,<2",
  "pydantic-settings>=2.9,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.26,<2",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
